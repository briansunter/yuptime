version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"

  # Bun/npm packages (root)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "backend"
    groups:
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
      kubernetes:
        patterns:
          - "@kubernetes/*"
      fastify:
        patterns:
          - "fastify*"
          - "@fastify/*"
      database:
        patterns:
          - "drizzle*"
          - "postgres"
          - "etcd3"

  # Bun/npm packages (frontend)
  # Note: /web workspace removed — frontend is not yet implemented.

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "docker"
    labels:
      - "dependencies"
      - "docker"
