name: PR Validation

on:
  pull_request:
    paths:
      - 'timoni/yuptime/**/*.cue'
      - 'scripts/**'

permissions:
  contents: read
  issues: write

jobs:
  validate-generated:
    name: Validate Generated Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.3"

      - name: Setup Timoni
        uses: stefanprodan/timoni/actions/setup@69e421aebbed979ded721df0da2a54428c5b4b9c
        with:
          version: v0.27.0

      - name: Setup Helm
        uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78
        with:
          version: 'v3.16.0'

      - name: Install dependencies
        run: bun install

      - name: Generate artifacts
        run: |
          bun run generate:helm
          bun run generate:manifests

      - name: Validate generated artifacts
        run: bun run validate:generated

      - name: Check for drift
        run: |
          git diff --exit-code helm/yuptime/ manifests/ k8s/crds.yaml || {
            echo "❌ Generated artifacts are out of date"
            echo "Please run: bun run generate:all"
            exit 1
          }

      - name: Post validation comment
        if: failure()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            body: '### ⚠️ Generated Artifacts Out of Date\n\nThe CUE templates have changed but the generated artifacts have not been updated.\n\n**Please run:**\n```bash\nbun run generate:all\n```\n\nThis will regenerate:\n- `helm/yuptime/` - Helm chart\n- `manifests/` - Static YAML manifests\n- `k8s/crds.yaml` - CRD mirror\n\nThen commit the changes.'
            })
