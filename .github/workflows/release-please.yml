name: Release Please

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_version:
        description: "Existing release version to publish"
        required: true
        type: string

permissions: {}

env:
  GHCR_REGISTRY: ghcr.io
  TIMONI_MODULE_NAME: yuptime

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.release_version != '') }}
      tag_name: ${{ steps.release.outputs.tag_name || (github.event_name == 'workflow_dispatch' && format('v{0}', inputs.release_version)) }}
      version: ${{ steps.release.outputs.version || inputs.release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Release Please
        uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: master

  test:
    name: Run Unit Tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.3"

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun run test:ci

      - name: Run linting
        run: bun run lint

      - name: Type check
        run: bun run type-check

  e2e-test:
    name: E2E Tests
    permissions:
      contents: read
    needs: [release-please, test]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/e2e.yml

  build-api:
    name: Build API Image
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    needs: [release-please, test, e2e-test]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@18ce135bb5112fa8ce4ed6c17ab05699d7f3a5e0

      - name: Login to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ github.repository }}-api
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.version }}
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-checker:
    name: Build Checker Image
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    needs: [release-please, test, e2e-test]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@18ce135bb5112fa8ce4ed6c17ab05699d7f3a5e0

      - name: Login to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ github.repository }}-checker
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.version }}
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ./Dockerfile.checker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-timoni-module:
    name: Publish Timoni Module
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    needs: [release-please, build-api, build-checker]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Timoni
        uses: stefanprodan/timoni/actions/setup@69e421aebbed979ded721df0da2a54428c5b4b9c
        with:
          version: v0.27.0

      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | timoni registry login ghcr.io -u "$GH_USER" --password-stdin

      - name: Validate module
        run: |
          cd timoni/yuptime
          timoni mod vet .

      - name: Push module to GHCR
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          timoni mod push ./timoni/yuptime \
            "oci://ghcr.io/$GITHUB_REPOSITORY/timoni-module" \
            --version "$RELEASE_VERSION" \
            --latest \
            -a 'org.opencontainers.image.licenses=Apache-2.0' \
            -a "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -a 'org.opencontainers.image.description=Yuptime - Kubernetes-native monitoring solution'

  generate-artifacts:
    name: Generate Helm Chart & Manifests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [release-please, build-api, build-checker]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.3"

      - name: Setup Timoni
        uses: stefanprodan/timoni/actions/setup@69e421aebbed979ded721df0da2a54428c5b4b9c
        with:
          version: v0.27.0

      - name: Install dependencies
        run: bun install

      - name: Generate Helm chart
        run: bun run generate:helm

      - name: Generate static manifests
        run: bun run generate:manifests

      - name: Validate generated artifacts
        run: bun run validate:generated

      - name: Upload Helm chart artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: helm-chart
          path: helm/yuptime/

  publish-helm:
    name: Publish Helm Chart to OCI
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    needs: [release-please, generate-artifacts]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Download Helm chart artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: helm-chart
          path: helm/yuptime/

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: 'v3.16.0'

      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GH_USER" --password-stdin

      - name: Package Helm chart
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: helm package helm/yuptime --version "$RELEASE_VERSION" --destination ./

      - name: Publish Helm chart to OCI
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: helm push "yuptime-${RELEASE_VERSION}.tgz" "oci://ghcr.io/$GITHUB_REPOSITORY/charts"

  commit-artifacts:
    name: Commit Generated Artifacts
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [generate-artifacts, publish-helm]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Download Helm chart artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: helm-chart
          path: helm/yuptime/

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/yuptime/ manifests/
          git diff --staged --quiet || git commit -m "chore: auto-generate Helm chart and manifests [skip ci]"
          git push

  make-packages-public:
    name: Make Packages Public
    permissions:
      packages: write
    runs-on: ubuntu-latest
    needs: [publish-timoni-module, publish-helm]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
      - name: Make packages public
        run: |
          # Make API image public
          curl -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/user/packages/container/yuptime-api \
            -d '{"visibility":"public"}' || echo "Failed to make yuptime-api public (may need manual action)"

          # Make checker image public
          curl -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/user/packages/container/yuptime-checker \
            -d '{"visibility":"public"}' || echo "Failed to make yuptime-checker public (may need manual action)"

          echo "Note: If the above commands failed, please manually make packages public at:"
          echo "- https://github.com/users/briansunter/packages/container/yuptime-api/settings"
          echo "- https://github.com/users/briansunter/packages/container/yuptime-checker/settings"
