---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: api-server
    app.kubernetes.io/managed-by: timoni
    app.kubernetes.io/name: yuptime
    app.kubernetes.io/version: 0.0.0-devel
  name: yuptime-api
  namespace: yuptime
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: api-server
      app.kubernetes.io/name: yuptime
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api-server
        app.kubernetes.io/name: yuptime
    spec:
      containers:
      - env:
        - name: NODE_ENV
          value: development
        - name: LOG_LEVEL
          value: info
        - name: PORT
          value: "3000"
        - name: NODE_EXTRA_CA_CERTS
          value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        - name: CHECKER_IMAGE
          value: ghcr.io/yuptime/yuptime-checker:latest
        - name: CHECKER_IMAGE_PULL_POLICY
          value: IfNotPresent
        - name: CHECKER_SERVICE_ACCOUNT
          value: yuptime-checker
        - name: JOB_TTL_SECONDS
          value: "120"
        - name: EXECUTION_MODE
          value: sidecar
        - name: EXECUTION_CONCURRENCY
          value: "4"
        - name: EXECUTION_QUEUE_CAPACITY
          value: "256"
        - name: EXECUTION_SHUTDOWN_GRACE_SECONDS
          value: "15"
        - name: CHECKER_URL
          value: http://127.0.0.1:3001
        - name: KUBE_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: ghcr.io/yuptime/yuptime-api:latest
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
        name: api-server
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 2
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /health
            port: 3000
          periodSeconds: 2
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      - command:
        - bun
        - src/checker-sidecar/server.ts
        env:
        - name: NODE_ENV
          value: development
        - name: LOG_LEVEL
          value: info
        - name: CHECKER_PORT
          value: "3001"
        - name: CHECKER_CONCURRENCY
          value: "4"
        - name: CHECKER_SHUTDOWN_GRACE_MS
          value: "15000"
        image: ghcr.io/yuptime/yuptime-checker:latest
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - bun
            - -e
            - const r=await fetch('http://127.0.0.1:3001/health');process.exit(r.ok?0:1)
        name: checker
        readinessProbe:
          exec:
            command:
            - bun
            - -e
            - const r=await fetch('http://127.0.0.1:3001/ready');process.exit(r.ok?0:1)
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_RAW
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
        startupProbe:
          exec:
            command:
            - bun
            - -e
            - const r=await fetch('http://127.0.0.1:3001/health');process.exit(r.ok?0:1)
          failureThreshold: 30
          periodSeconds: 2
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: yuptime
      volumes:
      - emptyDir: {}
        name: tmp

