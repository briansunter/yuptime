---
apiVersion: v1
data:
  LOG_LEVEL: "{{ .Values.logging.level }}"
  NODE_ENV: "{{ .Values.mode }}"
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/managed-by: timoni
    app.kubernetes.io/name: {{ include "yuptime.fullname" . }}
    app.kubernetes.io/version: 0.0.0-devel
  name: {{ include "yuptime.fullname" . }}-config
  namespace: {{ .Release.Namespace }}