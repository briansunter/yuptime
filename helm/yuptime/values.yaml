# Default values for yuptime
# Mirrors timoni/yuptime/values.cue and templates/config.cue.
# Do not edit manually without updating the Timoni module.

image:
  repository: ghcr.io/yuptime/yuptime-api
  pullPolicy: IfNotPresent
  tag: "" # Defaults to .Chart.AppVersion

checkerImage:
  repository: ghcr.io/yuptime/yuptime-checker
  pullPolicy: IfNotPresent
  tag: "" # Defaults to .Chart.AppVersion

mode: development

logging:
  level: info # debug | info | warn | error

replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

service:
  type: ClusterIP
  port: 3000
  annotations: {}

probes:
  liveness:
    enabled: true
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 2

podAnnotations: {}
imagePullSecrets: []
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

networkPolicy:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

crds:
  install: false

testResources:
  enabled: false

test:
  enabled: false
  image:
    repository: cgr.dev/chainguard/curl
    pullPolicy: IfNotPresent
    tag: latest
