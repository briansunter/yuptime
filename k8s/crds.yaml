# Yuptime Custom Resource Definitions
# API Group: monitoring.yuptime.io/v1
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: monitors.monitoring.yuptime.io
spec:
  group: monitoring.yuptime.io
  names:
    kind: Monitor
    listKind: MonitorList
    plural: monitors
    singular: monitor
    shortNames:
      - mon
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - type
                - schedule
                - target
              properties:
                enabled:
                  type: boolean
                  default: true
                type:
                  type: string
                  enum: [http, tcp, ping, dns, keyword, jsonQuery, xmlQuery, htmlQuery, websocket, push, steam, k8s, docker, mysql, postgresql, redis, grpc]
                schedule:
                  type: object
                  required:
                    - intervalSeconds
                    - timeoutSeconds
                  properties:
                    intervalSeconds:
                      type: integer
                      minimum: 1
                    timeoutSeconds:
                      type: integer
                      minimum: 1
                    retries:
                      type: object
                      properties:
                        maxRetries:
                          type: integer
                          minimum: 0
                        retryIntervalSeconds:
                          type: integer
                          minimum: 1
                    initialDelaySeconds:
                      type: integer
                      minimum: 0
                    graceDownSeconds:
                      type: integer
                      minimum: 0
                    jitterPercent:
                      type: integer
                      minimum: 0
                      maximum: 100
                target:
                  type: object
                  properties:
                    http:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    tcp:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    dns:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    websocket:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    ping:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    push:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    steam:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    k8s:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    kubernetes:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    mysql:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    postgresql:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    redis:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    grpc:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    keyword:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    jsonQuery:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                successCriteria:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                alerting:
                  type: object
                  properties:
                    policyRef:
                      type: object
                      properties:
                        name:
                          type: string
                    resendIntervalMinutes:
                      type: integer
                      minimum: 0
                      default: 0
                    notifyOn:
                      type: object
                      properties:
                        down:
                          type: boolean
                          default: true
                        up:
                          type: boolean
                          default: true
                        flapping:
                          type: boolean
                          default: true
                        certExpiring:
                          type: boolean
                          default: true
                alertmanagerUrl:
                  type: string
                  format: uri
                tags:
                  type: array
                  items:
                    type: string
                annotations:
                  type: object
                  additionalProperties:
                    type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                lastResult:
                  type: object
                  properties:
                    state:
                      type: string
                      enum: [up, down, pending, flapping, paused]
                    checkedAt:
                      type: string
                    latencyMs:
                      type: number
                    attempts:
                      type: integer
                    reason:
                      type: string
                    message:
                      type: string
                previousResult:
                  type: object
                  properties:
                    state:
                      type: string
                      enum: [up, down, pending, flapping, paused]
                    checkedAt:
                      type: string
                    latencyMs:
                      type: number
                    attempts:
                      type: integer
                    reason:
                      type: string
                    message:
                      type: string
                uptime:
                  type: object
                  properties:
                    last1h:
                      type: number
                    last24h:
                      type: number
                    last7d:
                      type: number
                    last30d:
                      type: number
                cert:
                  type: object
                  properties:
                    expiresAt:
                      type: string
                    daysRemaining:
                      type: number
                    valid:
                      type: boolean
                nextRunAt:
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: Status
          type: string
          jsonPath: .status.lastResult.state
        - name: Last Check
          type: string
          jsonPath: .status.lastResult.checkedAt
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: maintenancewindows.monitoring.yuptime.io
spec:
  group: monitoring.yuptime.io
  names:
    kind: MaintenanceWindow
    listKind: MaintenanceWindowList
    plural: maintenancewindows
    singular: maintenancewindow
  scope: Namespaced
  versions:
