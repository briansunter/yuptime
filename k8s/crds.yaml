---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    app.kubernetes.io/managed-by: timoni
    app.kubernetes.io/name: yuptime
    app.kubernetes.io/version: 0.0.0-devel
  name: monitors.monitoring.yuptime.io
spec:
  group: monitoring.yuptime.io
  names:
    kind: Monitor
    listKind: MonitorList
    plural: monitors
    shortNames:
    - mon
    singular: monitor
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.lastResult.state
      name: Status
      type: string
    - jsonPath: .status.lastResult.checkedAt
      name: Last Check
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              alerting:
                properties:
                  notifyOn:
                    properties:
                      certExpiring:
                        default: true
                        type: boolean
                      down:
                        default: true
                        type: boolean
                      flapping:
                        default: true
                        type: boolean
                      up:
                        default: true
                        type: boolean
                    type: object
                  policyRef:
                    properties:
                      name:
                        type: string
                    type: object
                  resendIntervalMinutes:
                    default: 0
                    minimum: 0
                    type: integer
                type: object
              alertmanagerUrl:
                format: uri
                type: string
              annotations:
                additionalProperties:
                  type: string
                type: object
              enabled:
                default: true
                type: boolean
              schedule:
                properties:
                  graceDownSeconds:
                    minimum: 0
                    type: integer
                  initialDelaySeconds:
                    minimum: 0
                    type: integer
                  intervalSeconds:
                    minimum: 20
                    type: integer
                  jitterPercent:
                    maximum: 100
                    minimum: 0
                    type: integer
                  retries:
                    properties:
                      maxRetries:
                        minimum: 0
                        type: integer
                      retryIntervalSeconds:
                        minimum: 1
                        type: integer
                    type: object
                  timeoutSeconds:
                    minimum: 1
                    type: integer
                required:
                - intervalSeconds
                - timeoutSeconds
                type: object
                x-kubernetes-validations:
                - message: timeoutSeconds must be less than intervalSeconds
                  rule: self.timeoutSeconds < self.intervalSeconds
              successCriteria:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              tags:
                items:
                  type: string
                type: array
              target:
                properties:
                  dns:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  grpc:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  http:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  jsonQuery:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  k8s:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  keyword:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  kubernetes:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  mysql:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  ping:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  postgresql:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  push:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  redis:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  steam:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  tcp:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  websocket:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                type: object
              type:
                enum:
                - http
                - tcp
                - ping
                - dns
                - keyword
                - jsonQuery
                - xmlQuery
                - htmlQuery
                - websocket
                - push
                - steam
                - k8s
                - docker
                - mysql
                - postgresql
                - redis
                - grpc
                type: string
            required:
            - type
            - schedule
            - target
            type: object
          status:
            properties:
              cert:
                properties:
                  daysRemaining:
                    type: number
                  expiresAt:
                    type: string
                  valid:
                    type: boolean
                type: object
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  type: object
                type: array
              lastResult:
                properties:
                  attempts:
                    type: integer
                  checkedAt:
                    type: string
                  executionId:
                    type: string
                  latencyMs:
                    type: number
                  message:
                    type: string
                  reason:
                    type: string
                  scheduledAt:
                    type: string
                  startedAt:
                    type: string
                  state:
                    enum:
                    - up
                    - down
                    - pending
                    - flapping
                    - paused
                    type: string
                type: object
              nextRunAt:
                type: string
              observedGeneration:
                type: integer
              previousResult:
                properties:
                  attempts:
                    type: integer
                  checkedAt:
                    type: string
                  executionId:
                    type: string
                  latencyMs:
                    type: number
                  message:
                    type: string
                  reason:
                    type: string
                  scheduledAt:
                    type: string
                  startedAt:
                    type: string
                  state:
                    enum:
                    - up
                    - down
                    - pending
                    - flapping
                    - paused
                    type: string
                type: object
              uptime:
                properties:
                  last1h:
                    type: number
                  last7d:
                    type: number
                  last24h:
                    type: number
                  last30d:
                    type: number
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    app.kubernetes.io/managed-by: timoni
    app.kubernetes.io/name: yuptime
