  group: monitoring.yuptime.io
  names:
    kind: MonitorSet
    listKind: MonitorSetList
    plural: monitorsets
    singular: monitorset
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - items
              properties:
                defaults:
