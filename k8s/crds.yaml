apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    app.kubernetes.io/managed-by: timoni
    app.kubernetes.io/name: yuptime
    app.kubernetes.io/version: 0.0.0-devel
  name: yuptimesettings.monitoring.yuptime.io
spec:
  group: monitoring.yuptime.io
  names:
    kind: YuptimeSettings
    listKind: YuptimeSettingsList
    plural: yuptimesettings
    singular: yuptimesettings
  scope: Cluster
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              mode:
                properties:
                  gitOpsReadOnly:
                    default: false
                    type: boolean
                  singleInstanceRequired:
                    default: true
                    type: boolean
                type: object
              networking:
                properties:
                  dns:
                    properties:
                      resolvers:
                        items:
                          type: string
                        type: array
                      timeoutSeconds:
                        default: 5
                        minimum: 1
                        type: integer
                    type: object
                  ping:
                    properties:
                      mode:
                        default: tcpFallback
                        enum:
                        - icmp
                        - tcpFallback
                        - tcpOnly
                        type: string
                      tcpFallbackPort:
                        default: 443
                        maximum: 65535
                        minimum: 1
                        type: integer
                    type: object
                  userAgent:
                    default: Yuptime/1.0
                    type: string
                type: object
              scheduler:
                properties:
                  defaultTimeoutSeconds:
                    default: 10
                    minimum: 1
                    type: integer
                  flapping:
                    properties:
                      enabled:
                        default: true
                        type: boolean
                      suppressNotificationsMinutes:
                        default: 30
                        minimum: 0
                        type: integer
                      toggleThreshold:
                        default: 6
                        minimum: 1
                        type: integer
                      windowMinutes:
                        default: 10
                        minimum: 1
                        type: integer
                    type: object
                  jitterPercent:
                    default: 5
                    maximum: 100
                    minimum: 0
                    type: integer
                  maxConcurrentNetChecks:
                    default: 200
                    minimum: 1
                    type: integer
                  maxConcurrentPrivChecks:
                    default: 20
                    minimum: 1
                    type: integer
                  minIntervalSeconds:
                    default: 20
                    minimum: 1
                    type: integer
                type: object
            required:
            - mode
            - scheduler
            - networking
            type: object
          status:
            properties:
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  type: object
                type: array
              errors:
                items:
                  type: string
                type: array
              lastValidation:
                type: string
              observedGeneration:
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
