                behavior:
                  type: object
                  properties:
                    suppressNotifications:
                      type: boolean
                      default: true
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                isActive:
                  type: boolean
                nextOccurrence:
                  type: string
                monitorCount:
                  type: integer
      subresources:
        status: {}

