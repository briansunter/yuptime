---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: yuptimesettings.monitoring.yuptime.io
spec:
  group: monitoring.yuptime.io
  names:
    kind: YuptimeSettings
    listKind: YuptimeSettingsList
    plural: yuptimesettings
    singular: yuptimesettings
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - mode
                - scheduler
                - networking
              properties:
                mode:
                  type: object
                  properties:
                    gitOpsReadOnly:
                      type: boolean
                      default: false
                    singleInstanceRequired:
                      type: boolean
                      default: true
                scheduler:
                  type: object
                  properties:
                    minIntervalSeconds:
                      type: integer
                      minimum: 1
                      default: 20
                    maxConcurrentNetChecks:
                      type: integer
                      minimum: 1
                      default: 200
                    maxConcurrentPrivChecks:
                      type: integer
                      minimum: 1
                      default: 20
                    defaultTimeoutSeconds:
                      type: integer
                      minimum: 1
                      default: 10
                    jitterPercent:
                      type: integer
                      minimum: 0
                      maximum: 100
                      default: 5
                    flapping:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: true
                        toggleThreshold:
                          type: integer
                          minimum: 1
                          default: 6
                        windowMinutes:
                          type: integer
                          minimum: 1
                          default: 10
                        suppressNotificationsMinutes:
                          type: integer
                          minimum: 0
                          default: 30
                networking:
                  type: object
                  properties:
                    userAgent:
                      type: string
                      default: Yuptime/1.0
                    dns:
                      type: object
                      properties:
                        resolvers:
                          type: array
                          items:
                            type: string
                        timeoutSeconds:
                          type: integer
                          minimum: 1
                          default: 5
                    ping:
                      type: object
                      properties:
                        mode:
                          type: string
                          enum: [icmp, tcpFallback, tcpOnly]
                          default: tcpFallback
                        tcpFallbackPort:
                          type: integer
                          minimum: 1
                          maximum: 65535
                          default: 443
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                lastValidation:
                  type: string
                errors:
                  type: array
                  items:
                    type: string
      subresources:
        status: {}
