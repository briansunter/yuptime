      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - schedule
                - behavior
              properties:
                enabled:
                  type: boolean
                  default: true
                schedule:
                  type: object
                  required:
                    - start
                    - end
                  properties:
                    start:
                      type: string
                    end:
                      type: string
                    recurrence:
                      type: object
                      properties:
                        rrule:
                          type: string
                match:
                  type: object
