# Test resources for the current CUE-authoritative CRD surface
---
apiVersion: monitoring.yuptime.io/v1
kind: YuptimeSettings
metadata:
  name: yuptime
spec:
  mode:
    gitOpsReadOnly: true
    singleInstanceRequired: true
  scheduler:
    minIntervalSeconds: 20
    maxConcurrentNetChecks: 100
    maxConcurrentPrivChecks: 20
    defaultTimeoutSeconds: 10
    jitterPercent: 5
  networking:
    userAgent: "Yuptime/1.0"
    dns:
      resolvers:
        - "8.8.8.8"
        - "1.1.1.1"

---
# Monitor - HTTP check for Google
apiVersion: monitoring.yuptime.io/v1
kind: Monitor
metadata:
  name: google-http
  namespace: default
  labels:
    tier: external
    env: production
spec:
  enabled: true
  type: http
  schedule:
    intervalSeconds: 30
    timeoutSeconds: 10
    retries:
      maxRetries: 2
      retryIntervalSeconds: 5
  target:
    http:
      url: https://www.google.com
      method: GET
      followRedirects: true
  successCriteria:
    http:
      acceptedStatusCodes: [200, 301, 302]
      latencyMsUnder: 5000
  tags:
    - search-engine
    - external

---
# Monitor - HTTP check for CloudFlare DNS
apiVersion: monitoring.yuptime.io/v1
kind: Monitor
metadata:
  name: cloudflare-http
  namespace: default
  labels:
    tier: external
    env: production
spec:
  enabled: true
  type: http
  schedule:
    intervalSeconds: 30
    timeoutSeconds: 10
    retries:
      maxRetries: 2
      retryIntervalSeconds: 5
  target:
    http:
      url: https://1.1.1.1
      method: GET
      tls:
        verify: true
  successCriteria:
    http:
      acceptedStatusCodes: [200]
  tags:
    - dns
    - external

---
# Monitor - TCP check for Google DNS
apiVersion: monitoring.yuptime.io/v1
kind: Monitor
metadata:
  name: google-dns-tcp
  namespace: default
  labels:
    tier: external
    service: dns
spec:
  enabled: true
  type: tcp
  schedule:
    intervalSeconds: 60
    timeoutSeconds: 5
  target:
    tcp:
      host: 8.8.8.8
      port: 53
  tags:
    - dns
    - google

---
# Monitor - DNS check
apiVersion: monitoring.yuptime.io/v1
kind: Monitor
metadata:
  name: google-dns-resolve
  namespace: default
  labels:
    tier: external
    service: dns
spec:
  enabled: true
  type: dns
  schedule:
    intervalSeconds: 60
    timeoutSeconds: 10
  target:
    dns:
      name: google.com
      recordType: A
  tags:
    - dns
    - resolution

---
# Monitor - Local Yuptime API
apiVersion: monitoring.yuptime.io/v1
kind: Monitor
metadata:
  name: yuptime-api-health
  namespace: yuptime
  labels:
    tier: internal
    service: yuptime
spec:
  enabled: true
  type: http
  schedule:
    intervalSeconds: 15
    timeoutSeconds: 5
  target:
    http:
      url: http://yuptime-api.yuptime.svc.cluster.local:3000/health
      method: GET
  successCriteria:
    http:
      acceptedStatusCodes: [200]
  tags:
    - internal
    - api

---
# Monitor - Kubernetes deployment readiness
apiVersion: monitoring.yuptime.io/v1
kind: Monitor
metadata:
  name: api-deployment
  namespace: yuptime
  labels:
    env: production
    service: api
spec:
  enabled: true
  type: k8s
  schedule:
    intervalSeconds: 60
    timeoutSeconds: 15
  target:
    k8s:
      resource:
        apiVersion: apps/v1
        kind: Deployment
        name: api
      check:
        type: AvailableReplicasAtLeast
        min: 2
  tags:
    - kubernetes
    - internal

---
# MonitorSet - Batch HTTP checks with shared defaults
apiVersion: monitoring.yuptime.io/v1
kind: MonitorSet
metadata:
  name: edge-services
  namespace: yuptime
spec:
  defaults:
    schedule:
      intervalSeconds: 60
      timeoutSeconds: 10
    successCriteria:
      http:
        acceptedStatusCodes: [200]
    alertmanagerUrl: "http://alertmanager.monitoring:9093/api/v2/alerts"
  items:
    - name: marketing-site
      spec:
        type: http
        target:
          http:
            url: "https://example.com"
    - name: api-gateway
      spec:
        type: http
        target:
          http:
            url: "https://api.example.com/health"

---
# MaintenanceWindow - Weekly recurring deployment window
apiVersion: monitoring.yuptime.io/v1
kind: MaintenanceWindow
metadata:
  name: weekly-maintenance
  namespace: yuptime
spec:
  enabled: true
  schedule:
    start: "2026-03-15T02:00:00Z"
    end: "2026-03-15T04:00:00Z"
    recurrence:
      rrule: "FREQ=WEEKLY;BYDAY=SU"
  match:
    matchLabels:
      matchLabels:
        env: production
  behavior:
    suppressNotifications: true

---
# Silence - Temporary mute for a known incident
apiVersion: monitoring.yuptime.io/v1
kind: Silence
metadata:
  name: api-incident
  namespace: yuptime
spec:
  expiresAt: "2026-03-16T12:00:00Z"
  match:
    names:
      - namespace: yuptime
        name: api-deployment
    tags:
      - internal
  reason: "Temporary mute during incident response"
